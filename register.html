
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071A35">
  <title>Create Account | KL EMPIRE</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 80% 10%, rgba(23,105,255,.2), transparent 35%),
        #071A35;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 22px;
      border: 1px solid rgba(112,175,255,.2);
      background: rgba(16,43,80,.75);
      box-shadow: 0 25px 80px rgba(0,0,0,.3);
    }

    .brand {
      text-align: center;
      font-size: 27px;
      font-weight: 900;
    }

    .brand span { color: #70AFFF; }

    .subtitle {
      text-align: center;
      color: #9CB2D0;
      font-size: 13px;
      margin: 10px 0 30px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 9px;
      color: #D5E5FA;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(112,175,255,.2);
      background: #071A35;
      color: white;
      outline: none;
      margin-bottom: 20px;
    }

    input:focus { border-color: #1769FF; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1769FF;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: not-allowed; }

    #message {
      margin-top: 17px;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .links {
      text-align: center;
      font-size: 12px;
      color: #9CB2D0;
      margin-top: 22px;
      line-height: 2;
    }

    a { color: #70AFFF; text-decoration: none; }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">KL <span>EMPIRE.</span></div>
    <p class="subtitle">Create your KL EMPIRE account.</p>

    <form id="registerForm">
      <label for="email">EMAIL ADDRESS</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">PASSWORD</label>
      <input
        type="password"
        id="password"
        placeholder="Minimum 8 characters"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">CONFIRM PASSWORD</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Re-enter your password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="registerBtn">CREATE ACCOUNT →</button>
    </form>

    <p id="message" role="status"></p>

    <div class="links">
      Already have an account? <a href="login.html">Sign in</a>
      <br>
      <a href="index.html">← Back to homepage</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerBtn");

    const config = window.KL_CONFIG;

    if (!config || !config.SUPABASE_URL || !config.SUPABASE_KEY) {
      message.textContent = "Configuration error. Please contact support.";
      message.style.color = "#ff7777";
      button.disabled = true;
    } else {
      const supabase = window.supabase.createClient(
        config.SUPABASE_URL,
        config.SUPABASE_KEY
      );

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          message.style.color = "#ff7777";
          message.textContent = "Passwords do not match.";
          return;
        }

        button.disabled = true;
        button.textContent = "CREATING ACCOUNT...";
        message.textContent = "";

        try {
          const { data, error } = await supabase.auth.signUp({
            email,
            password
          });

          if (error) throw error;

          message.style.color = "#42E6A4";

          if (data.session) {
            message.textContent = "Account created! Redirecting...";
            window.location.href = "dashboard.html";
          } else {
            message.textContent =
              "Registration successful. Please check your email to confirm your account before signing in.";
            button.textContent = "ACCOUNT CREATED";
          }

        } catch (error) {
          message.style.color = "#ff7777";
          message.textContent = error.message || "Registration failed.";
          button.disabled = false;
          button.textContent = "CREATE ACCOUNT →";
        }
      });
    }
  </script>
</body>
</html>
